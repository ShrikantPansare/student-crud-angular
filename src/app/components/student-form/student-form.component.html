<div class="card">
  <div class="row">
    <div class="col">
      <h2>{{ getTitle() }}</h2>
    </div>
    <div class="col text-right">
      <button class="btn btn-primary" (click)="onCancel()">
        ← Back to List
      </button>
    </div>
  </div>

  <div *ngIf="loading" class="text-center">
    <p>Loading...</p>
  </div>

  <form *ngIf="!loading" [formGroup]="studentForm" (ngSubmit)="onSubmit()">
    <div class="row">
      <div class="col-6">
        <div class="form-group">
          <label class="form-label" for="name">
            Student Name <span class="required">*</span>
          </label>
          <input
            type="text"
            id="name"
            class="form-control"
            formControlName="name"
            placeholder="Enter student name"
            maxlength="100"
          >
          <div *ngIf="studentForm.get('name')?.invalid && studentForm.get('name')?.touched" class="text-danger">
            <small *ngIf="studentForm.get('name')?.errors?.['required']">Name is required</small>
            <small *ngIf="studentForm.get('name')?.errors?.['maxlength']">Name cannot exceed 100 characters</small>
          </div>
        </div>
      </div>

      <div class="col-6">
        <div class="form-group">
          <label class="form-label" for="city">
            City <span class="required">*</span>
          </label>
          <select
            id="city"
            class="form-control"
            formControlName="city"
          >
            <option value="">Select City</option>
            <option *ngFor="let city of cities" [value]="city">{{ city }}</option>
          </select>
          <div *ngIf="studentForm.get('city')?.invalid && studentForm.get('city')?.touched" class="text-danger">
            <small *ngIf="studentForm.get('city')?.errors?.['required']">City is required</small>
          </div>
        </div>
      </div>
    </div>

    <div class="row">
      <div class="col-12">
        <div class="form-group">
          <label class="form-label" for="address">
            Address <span class="required">*</span>
          </label>
          <textarea
            id="address"
            class="form-control"
            formControlName="address"
            placeholder="Enter student address"
            rows="3"
          ></textarea>
          <div *ngIf="studentForm.get('address')?.invalid && studentForm.get('address')?.touched" class="text-danger">
            <small *ngIf="studentForm.get('address')?.errors?.['required']">Address is required</small>
          </div>
        </div>
      </div>
    </div>

    <div class="row">
      <div class="col-6">
        <div class="form-group">
          <label class="form-label" for="birth_date">
            Birth Date <span class="required">*</span>
          </label>
          <input
            type="date"
            id="birth_date"
            class="form-control"
            formControlName="birth_date"
          >
          <div *ngIf="studentForm.get('birth_date')?.invalid && studentForm.get('birth_date')?.touched" class="text-danger">
            <small *ngIf="studentForm.get('birth_date')?.errors?.['required']">Birth date is required</small>
          </div>
        </div>
      </div>

      <div class="col-6">
        <div class="form-group">
          <label class="form-label">Status</label>
          <div class="toggle-switch">
            <input
              type="checkbox"
              id="is_active"
              formControlName="is_active"
            >
            <label class="slider" for="is_active"></label>
          </div>
          <div class="mt-3">
            <span [class]="studentForm.get('is_active')?.value ? 'text-success' : 'text-danger'">
              {{ studentForm.get('is_active')?.value ? 'Active' : 'Inactive' }}
            </span>
          </div>
        </div>
      </div>
    </div>

    <div class="text-center mt-3">
      <button
        type="submit"
        class="btn btn-primary"
        [disabled]="studentForm.invalid || isViewMode"
      >
        {{ getSubmitButtonText() }}
      </button>
      <button
        type="button"
        class="btn btn-secondary"
        (click)="onReset()"
      >
        {{ isViewMode ? 'Back' : 'Reset' }}
      </button>
      <button
        type="button"
        class="btn btn-danger"
        (click)="onCancel()"
      >
        Cancel
      </button>
    </div>
  </form>
</div>
